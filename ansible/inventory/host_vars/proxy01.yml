---
# Sites publies par Caddy, en HTTPS sur <nom>.divertissementestrie.ca.
# L'amont doit etre autorise par le pare-feu (regle 4 : PORTS_HTTP vers
# SERVICES_HTTP, ou une regle DMZ dediee). Cles optionnelles :
#   reseaux : seuls ces reseaux ont acces (les autres recoivent 403)
#   ca      : certificat de l'autorite d'un amont HTTPS (relatif a ansible/)
#   nom_tls : nom a verifier dans ce certificat, s'il ne contient pas l'adresse
#   redirige_vers : redirige vers <ce nom>.divertissementestrie.ca (sans upstream)
# Le nom "@" designe le domaine nu (divertissementestrie.ca).
# fw01 redirige aussi son port WAN 8443 vers proxy01:443 (reseau du cegep et
# VPN) : un site sans `reseaux` est donc joignable de la aussi.
# Exemple :
#   - nom: netdata
#     upstream: 10.10.20.22:19999
caddy_sites:
  # Interface web de Proxmox (pve, sur le reseau du cegep). Regle DMZ :
  # PROXY01 vers Proxmox:8006.
  - nom: proxmox
    upstream: https://10.85.2.127:8006
    ca: files/ca/proxmox.pem
    reseaux: &vlans_internes
      - 10.10.10.0/24
      - 10.10.20.0/24

  # Amonts en HTTPS. Regle DMZ : PROXY01 vers SERVICES_HTTPS:443.
  # Pour pfSense, le nom public doit aussi etre dans ses « Alternate Hostnames ».
  - nom: pfsense
    upstream: https://10.10.20.1
    ca: files/ca/pfsense.pem
    nom_tls: pfSense-6ac7f654224c2
    reseaux: *vlans_internes
  - nom: freepbx
    upstream: https://10.10.20.20
    ca: files/ca/freepbx.pem
    nom_tls: voip01
    reseaux: *vlans_internes
  - nom: veeam
    upstream: https://10.10.20.13
    ca: files/ca/veeam.pem
    reseaux: *vlans_internes

  # Amonts en HTTP (regle 4). Le site et phpMyAdmin passent par Traefik,
  # qui choisit l'Ingress selon le nom demande.
  - nom: osticket
    upstream: 10.10.20.12:80
    reseaux: *vlans_internes
  - nom: homarr
    upstream: 10.10.20.41:7575
    reseaux: *vlans_internes
  - nom: phpmyadmin
    upstream: 10.10.20.31:80
    reseaux: *vlans_internes

  # Site public du centre, sans restriction de reseau : le pare-feu laisse
  # passer les VLANs 10 et 20 (regle 2), et le reseau du cegep et le VPN par
  # la redirection WAN 8443 de fw01. Le domaine nu redirige vers www.
  - nom: www
    upstream: 10.10.20.31:80
  - nom: "@"
    redirige_vers: www
