[defaults]
inventory          = inventory/
roles_path         = roles
remote_user        = ansible
private_key_file   = ~/.ssh/ansible_cde
host_key_checking  = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
