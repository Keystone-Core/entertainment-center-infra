---
- name: Redemarrer Apache
  ansible.builtin.service:
    name: apache2
    state: restarted

# Recharger les regles efface les chaines de fail2ban : on le redemarre
# aussi pour qu'il les recree.
- name: Recharger le pare-feu
  ansible.builtin.command: systemctl restart netfilter-persistent fail2ban
  changed_when: true

- name: Recharger FreePBX
  ansible.builtin.command: fwconsole reload
  changed_when: true

# Apres le rechargement (les handlers s'executent dans cet ordre), pour
# qu'Asterisk demarre avec les fichiers a jour. Pas `fwconsole restart` :
# il verifie si Asterisk tourne avant la fin de l'arret, plante et le
# laisse arrete.
- name: Redemarrer Asterisk
  ansible.builtin.shell: fwconsole stop --immediate && fwconsole start
  changed_when: true
