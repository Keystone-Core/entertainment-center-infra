---
# Script d'installation officiel de FreePBX 17 (Debian 12 seulement),
# epingle sur un commit et verifie par empreinte : il ne change pas sous
# nos pieds. Pour changer de version, mettre a jour les deux valeurs.
freepbx_installer_commit: b023b8426786a518d25dfc0d11ba0c0314fcd927
freepbx_installer_sha256: afef5e4b480cf545b2035f92068dc2fdd32452989d170a16a84acb6e37b7d564
# Modules libres seulement ; chrony reste gere par le role base.
freepbx_installer_args: --opensourceonly --nochrony --skipversion

# Mots de passe generes sur le poste de controle, jamais dans le depot.
freepbx_secrets: /root/.cde-secrets/voip01
freepbx_admin: admin

# Postes du personnel (TEL-01 a TEL-04 du journal reseau), avec messagerie.
# `appareils` : nombre d'appareils connectes en meme temps sur le poste (1
# par defaut). Le 102 sonne sur le telephone de l'accueil et sur le PC.
freepbx_postes:
  - numero: 101
    nom: Gérance
  - numero: 102
    nom: Accueil
    appareils: 2
  - numero: 103
    nom: Soutien technique
  - numero: 104
    nom: Poste polyvalent

# Groupe d'appel qui fait sonner tous les postes en meme temps.
# Sans reponse, l'appel va a la messagerie du poste `messagerie`.
freepbx_groupe:
  numero: 600
  nom: Tout le personnel
  messagerie: 102

# Langue des messages vocaux.
freepbx_langue: fr

# Pare-feu de l'hote (journal reseau, section 10.2).
freepbx_reseaux_ssh:
  - 10.10.10.0/24        # VLAN 10, gestion
freepbx_reseaux_sip:
  - 10.10.20.0/24        # VLAN 20, telephones IP
  - 10.85.2.124/32       # Sortie du VPN Xray : softphones des PC, par fw01
freepbx_reseaux_web:
  - 10.10.10.0/24        # VLAN 10 (HTTPS, regle 1)
  - 10.10.80.10/32       # proxy01, pour une publication par Caddy
freepbx_rtp_debut: 10000
freepbx_rtp_fin: 20000

# Les PC passent par le VPN Xray et joignent voip01 par une redirection de
# ports sur l'adresse WAN de fw01. Asterisk annonce cette adresse aux
# appareils hors des reseaux locaux, et 10.10.20.20 aux autres.
freepbx_adresse_externe: 10.85.2.16
freepbx_reseaux_locaux:
  - 10.10.0.0/16
