# Apache + PHP-FPM serving the website of the Centre de divertissement de
# l'Estrie, published by Traefik as www.divertissementestrie.ca and web.cde.lan.
#
# Layout in the container:
#   /var/www/html/public            web root (ConfigMap web-public)
#   /var/www/html/app               PHP code, outside the web root (ConfigMap web-app)
#   /var/www/html/storage/uploads   uploaded files, outside the web root (PVC uploads)
#   /var/www/html/storage/sessions  PHP sessions, so a restart logs no one out (PVC sessions)
#
# Email for forgotten passwords comes from the optional Secret web-smtp (keys
# host, port, user, password, from: see README.md). Without it, the site
# still works and the staff give the links from /gestion/comptes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sessions
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
spec:
  replicas: 1
  strategy:
    type: Recreate                  # the volumes are ReadWriteOnce
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33               # www-data in the image
        runAsGroup: 33
      containers:
        - name: php
          # v5.0.3 turns off PHP session upload progress, which blocks
          # CVE-2026-115560. Keep it off (PHP_SESSION_UPLOAD_PROGRESS_ENABLED).
          image: serversideup/php:8.4-fpm-apache-trixie-v5.0.3
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mariadb
            - name: DB_NAME
              value: site
            - name: DB_USER
              value: site
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-db
                  key: password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PMA_URL
              value: https://phpmyadmin.divertissementestrie.ca/
            # Trust X-Forwarded-For from Traefik (10.42.0.0/16), so PHP
            # sees the real client address. The image defaults to Cloudflare.
            - name: TRUSTED_PROXY
              value: local
            - name: PHP_DATE_TIMEZONE
              value: America/Toronto
            - name: PHP_UPLOAD_MAX_FILE_SIZE
              value: 20M
            - name: PHP_POST_MAX_SIZE
              value: 25M
            # proxy01 serves the site over HTTPS.
            - name: PHP_SESSION_COOKIE_SECURE
              value: "true"
            - name: SHOW_WELCOME_MESSAGE
              value: "false"
            - name: SITE_URL
              value: https://www.divertissementestrie.ca
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: web-smtp
                  key: host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: web-smtp
                  key: port
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: web-smtp
                  key: user
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-smtp
                  key: password
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: web-smtp
                  key: from
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: public
              mountPath: /var/www/html/public
              readOnly: true
            - name: app
              mountPath: /var/www/html/app
              readOnly: true
            - name: uploads
              mountPath: /var/www/html/storage/uploads
            - name: sessions
              mountPath: /var/www/html/storage/sessions
      volumes:
        - name: public
          configMap:
            name: web-public
        - name: app
          configMap:
            name: web-app
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: sessions
          persistentVolumeClaim:
            claimName: sessions
---
apiVersion: v1
kind: Service
metadata:
  name: php
spec:
  selector:
    app: php
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik
  rules:
    - host: www.divertissementestrie.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: php
                port:
                  number: 80
    - host: web.cde.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: php
                port:
                  number: 80
