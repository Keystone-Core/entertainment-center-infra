# MariaDB for the site. Reachable only inside the cluster (Service
# `mariadb`, port 3306).
#
# Passwords come from the Secret `web-db` (keys `root-password` and
# `password`), created by hand on ctrl-iac: see README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate                  # never run two servers on the same data
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8.9
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: site
            - name: MARIADB_USER
              value: site
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-db
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-db
                  key: root-password
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: TZ
              value: America/Toronto
          # Checks the server answers and InnoDB is ready, with the
          # healthcheck account the image creates on first start.
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # Runs once, when the data folder is empty.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
        - name: init
          configMap:
            name: mariadb-init
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
